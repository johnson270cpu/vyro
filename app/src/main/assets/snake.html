<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14141f; color: #eee; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 12px; touch-action: none; }
  #bar { display: flex; justify-content: space-between; width: min(92vw, 360px); margin-bottom: 8px; }
  canvas { background: #0c0c14; border-radius: 10px; width: min(92vw, 360px); height: min(92vw, 360px); }
  p { color: #9aa; font-size: 14px; }
  button { margin-top: 8px; padding: 10px 22px; border: 0; border-radius: 10px; background: #FF5C93; color: #1A0510; font-weight: 700; }
</style>
</head>
<body>
  <div id="bar"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="c" width="360" height="360"></canvas>
  <p>Swipe on the board to steer</p>
  <button onclick="reset()">Restart</button>
<script>
var N = 18, S = 20;
var c = document.getElementById('c'), g = c.getContext('2d');
var snake, dir, next, food, score, dead, timer;
var best = 0;
try { best = parseInt(localStorage.getItem('snakeBest') || '0', 10) || 0; } catch (e) {}
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x: 9, y: 9}, {x: 8, y: 9}, {x: 7, y: 9}];
  dir = {x: 1, y: 0}; next = dir; score = 0; dead = false;
  document.getElementById('score').textContent = 0;
  placeFood();
  clearInterval(timer);
  timer = setInterval(step, 120);
  draw();
}
function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)};
  } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
}
function step() {
  if (dead) return;
  dir = next;
  var h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N ||
      snake.some(function (s) { return s.x === h.x && s.y === h.y; })) {
    dead = true;
    if (score > best) {
      best = score;
      document.getElementById('best').textContent = best;
      try { localStorage.setItem('snakeBest', String(best)); } catch (e) {}
    }
    draw();
    return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}
function draw() {
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = '#ff5c7a';
  g.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);
  snake.forEach(function (s, i) {
    g.fillStyle = i === 0 ? '#FF5C93' : '#c93c72';
    g.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
  });
  if (dead) {
    g.fillStyle = 'rgba(0,0,0,.6)';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#fff';
    g.font = 'bold 28px system-ui';
    g.textAlign = 'center';
    g.fillText('Game over', c.width / 2, c.height / 2);
  }
}
function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return;   // no instant reverse
  next = {x: x, y: y};
}
var sx = 0, sy = 0;
c.addEventListener('touchstart', function (e) {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; e.preventDefault();
}, {passive: false});
c.addEventListener('touchend', function (e) {
  var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  e.preventDefault();
}, {passive: false});
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowUp') turn(0, -1);
  if (e.key === 'ArrowDown') turn(0, 1);
  if (e.key === 'ArrowLeft') turn(-1, 0);
  if (e.key === 'ArrowRight') turn(1, 0);
});
reset();
</script>
</body>
</html>
