<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  :root { --bg:#0E0B1F; --card:#181330; --text:#F2F3FA; --muted:#8D90B0; --accent:#FF5C93; }
  :root[data-theme="light"] { --bg:#F4F5FB; --card:#FFFFFF; --text:#14152A; --muted:#6B6E8C; --accent:#E0356F; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:28px 18px; }
  h1 { margin:8px 0 4px; }
  p { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  a { display:block; padding:26px 16px; border-radius:18px; background:var(--card); color:var(--text);
      text-decoration:none; font-weight:700; font-size:18px; border-bottom:3px solid var(--accent); }
  a small { display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:4px; }
</style>
</head>
<body>
  <h1>Games</h1>
  <p>Built in. No internet needed.</p>
  <div class="grid">
    <a href="snake.html">Snake<small>Swipe to steer</small></a>
    <a href="memory.html">Memory<small>Match the pairs</small></a>
  </div>
<script>
var t = new URLSearchParams(location.search).get('theme');
document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
</script>
</body>
</html>
